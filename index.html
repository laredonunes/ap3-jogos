  var CHAVE_SALVA = "ap3.acesso.v1";
  var byte = function (b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); };

  function derivar(usuario, senha) {
    var texto = usuario.trim().toLowerCase() + "\n" + senha;
    return crypto.subtle.importKey("raw", new TextEncoder().encode(texto), "PBKDF2", false, ["deriveBits"])
      .then(function (base) {
        return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: byte(PACOTE.sal), iterations: PACOTE.iteracoes }, base, 256);
      });
  }
  function decifrar(bits) {
    return crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"])
      .then(function (chave) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: byte(PACOTE.iv) }, chave, byte(PACOTE.dados)); })
      .then(function (claro) { return new TextDecoder().decode(claro); });
  }
  function mostrar(html) {
    document.open();
    document.write(html);
    document.close();
  }
  function ler() { try { return localStorage.getItem(CHAVE_SALVA); } catch (e) { return null; } }
  function salvar(v) { try { localStorage.setItem(CHAVE_SALVA, v); } catch (e) {} }
  function apagar() { try { localStorage.removeItem(CHAVE_SALVA); } catch (e) {} }

  var salva = ler();
  if (salva) { decifrar(byte(salva).buffer).then(mostrar).catch(apagar); }

  document.getElementById("acesso").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var botao = document.getElementById("entrar");
    var erro = document.getElementById("erro");
    erro.textContent = "";
    botao.disabled = true;
    var lembrar = document.getElementById("lembrar").checked;
    derivar(document.getElementById("usuario").value, document.getElementById("senha").value)
      .then(function (bits) {
        return decifrar(bits).then(function (html) {
          if (lembrar) { salvar(btoa(String.fromCharCode.apply(null, new Uint8Array(bits)))); }
          mostrar(html);
        });
      })
      .catch(function () { botao.disabled = false; erro.textContent = "Usuário ou senha incorretos."; });
  });
})();
